:root{--bg:#fdfdfd;--c:#fff;--p:#111;--pd:#000;--t:#111;--m:#77727f;--b:#ece8f1;--er:#c8321f;--sh:#f4f0f8}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
header{direction:ltr;background:rgba(253,253,253,.94);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;z-index:5}
.ic{display:flex;gap:16px;align-items:center;min-width:72px}.ic:last-child{justify-content:flex-end}
.ic svg{width:26px;height:26px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.bn svg{width:24px;height:24px;fill:none;stroke:#111;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:stroke .3s}
.logo{height:23px;width:176px;cursor:pointer;display:block}
main{max-width:1000px;margin:auto;padding:8px 16px 120px}
.hero{text-align:center;padding:14px 10px 10px;color:var(--m)}
.bn{direction:ltr;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:7px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.28));-webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 12px rgba(0,0,0,.07),0 20px 36px -6px rgba(0,0,0,.2),inset 0 2px 1px rgba(255,255,255,.95),inset 0 -6px 14px rgba(255,255,255,.4),0 0 0 1px rgba(0,0,0,.05);z-index:6}
.bn a{position:relative;height:48px;min-width:52px;padding:0 13px;display:flex;align-items:center;justify-content:center;border-radius:99px;cursor:pointer;transition:background .3s,padding .3s}.bn span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:700;transition:max-width .35s,opacity .25s,margin .35s}
.bn a.on{background:#111;padding:0 18px;box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25)}.bn a.on svg{stroke:#fff}.bn a.on span{max-width:90px;opacity:1;margin-inline-start:8px;color:#fff}
.bn b{position:absolute;top:3px;right:6px;background:var(--er);color:#fff;border-radius:99px;font-size:11px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.menu{position:fixed;top:62px;right:14px;background:#fff;border:1px solid var(--b);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:7;display:none;min-width:170px}
.menu.on{display:block}.menu a{display:block;padding:10px 14px;cursor:pointer;border-radius:8px}.menu a:hover{background:var(--sh)}
#sb{display:none;padding:0 16px}#sb.on{display:block}
.in{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;font:inherit;margin:5px 0;background:#fff}
.in:focus{outline:2px solid var(--p)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--b);cursor:pointer;font-size:14px}
.chip.on{background:var(--pd);color:#fff;border-color:var(--pd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
.grid .card{margin:0;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:16px}
.img{aspect-ratio:1;background:var(--sh);border-radius:10px;display:grid;place-items:center;font-size:40px;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.m{color:var(--m);margin:0;font-size:13px}
.er{color:var(--er);font-size:13px}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--pd)}.btn.big{width:100%;padding:13px;margin-top:8px;font-size:16px}
.btn.del{background:var(--er)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--b)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--b);background:#fff;font-size:18px;cursor:pointer}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--pd);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
#toast.on{opacity:1}
ul{padding-inline-start:18px;margin:6px 0}
</style>

const SUPA_URL='https://nkbqwquyukgqhroksdpc.supabase.co';

const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){const{data}=await sb.from('products').select('*').order('id',{ascending:false});S.products=data||[];
  S.cart=S.cart.filter(i=>S.products.some(p=>p.id==i.id))}
async function setUser(u){S.user=u||null;S.admin=false;S.profile={};
  if(u){const[a,p]=await Promise.all([sb.from('admins').select('id').eq('id',u.id).maybeSingle(),sb.from('profiles').select('*').eq('id',u.id).maybeSingle()]);S.admin=!!a.data;S.profile=p.data||{}}}
async function init(){const{data:{session}}=await sb.auth.getSession();await setUser(session?.user);await load();render()}

function nav(){
  const ic={u:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6z"/></svg>',c:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>',g:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>',h:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>'};
  const n=S.cart.reduce((a,i)=>a+i.qty,0);
  const T=[['u','حسابي',S.user?'orders':'auth',['orders','auth']],['c','السلة','cart',['cart']],['g','الأقسام','cats',['cats']],['h','الرئيسية','shop',['shop']]];
  $('#bn').innerHTML=T.map(([k,l,v,vs])=>`<a class="${vs.includes(S.view)?'on':''}" onclick="go('${v}')">${ic[k]}${k=='c'&&n?`<b>${n}</b>`:''}<span>${l}</span></a>`).join('')}
function menu(){$('#menu').innerHTML=S.user?`<a onclick="go('orders')">طلباتي</a>`+(S.admin?`<a onclick="go('admin')">لوحة التحكم</a>`:'')+`<a onclick="logout()">تسجيل الخروج</a>`:`<a onclick="go('auth')">تسجيل الدخول</a>`}
function render(){nav();menu();V[S.view]()}

const V={
shop(){
  const cats=[...new Set(S.products.map(p=>p.category).filter(Boolean))];
  $('#app').innerHTML=`<div class="hero">عناية وجمال بلمسة لافندر</div>
  <div class="chips"><span class="chip ${!S.cat?'on':''}" onclick="S.cat='';render()">الكل</span>${cats.map(c=>`<span class="chip ${S.cat==c?'on':''}" data-c="${esc(c)}" onclick="S.cat=this.dataset.c;render()">${esc(c)}</span>`).join('')}</div>
  <div id="grid" class="grid"></div>`;grid()},
cats(){const cs=[...new Set(S.products.map(p=>p.category).filter(Boolean))];
  $('#app').innerHTML='<h2>الأقسام</h2>'+(cs.map(c=>`<div class="card row" style="cursor:pointer;padding:18px" data-c="${esc(c)}" onclick="S.cat=this.dataset.c;go('shop')"><b>${esc(c)}</b><span>‹</span></div>`).join('')||'<p class="m">لا توجد أقسام بعد.</p>')},
cart(){
  const rows=S.cart.map(i=>({...i,p:S.products.find(x=>x.id==i.id)})).filter(r=>r.p);
  const tot=rows.reduce((a,r)=>a+r.p.price*r.qty,0),pr=S.profile;
  $('#app').innerHTML=`<h2>سلة المشتريات</h2>`+(rows.length?
   rows.map(r=>`<div class="line"><span>${esc(r.p.name)}<br><small class="m">${fmt(r.p.price)}</small></span>
   <span class="qty"><button onclick="qty(${r.id},-1)">−</button>${r.qty}<button onclick="qty(${r.id},1)">+</button></span><b>${fmt(r.p.price*r.qty)}</b></div>`).join('')+
   `<div class="line"><b>المجموع</b><b>${fmt(tot)}</b></div>`+
   (S.user?`<h3>معلومات التوصيل</h3><input class="in" id="n" placeholder="الاسم" value="${esc(pr.full_name)}"><input class="in" id="ph" placeholder="رقم الهاتف" inputmode="tel" value="${esc(pr.phone)}"><textarea class="in" id="ad" placeholder="العنوان بالتفصيل">${esc(pr.address)}</textarea><input class="in" id="nt" placeholder="ملاحظات (اختياري)"><button class="btn big" onclick="checkout()">تأكيد الطلب (الدفع عند الاستلام)</button>`
   :`<button class="btn big" onclick="go('auth')">سجّل دخولك لإتمام الطلب</button>`)
   :`<p class="m">السلة فارغة. تصفح المنتجات وأضف ما يعجبك.</p><button class="btn" onclick="go('shop')">تصفح المتجر</button>`)},
auth(){
  const up=S.mode=='up';
  $('#app').innerHTML=`<div class="card" style="max-width:420px;margin:auto"><h2>${up?'إنشاء حساب':'تسجيل الدخول'}</h2>
  ${up?`<input class="in" id="an" placeholder="الاسم الكامل"><input class="in" id="ap" placeholder="رقم الهاتف" inputmode="tel"><textarea class="in" id="aa" placeholder="العنوان"></textarea>`:''}
  <input class="in" id="ae" type="email" placeholder="الإيميل"><input class="in" id="aw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)">
  <button class="btn big" onclick="doAuth()">${up?'إنشاء الحساب':'دخول'}</button>
  <p class="m" style="text-align:center;cursor:pointer;margin-top:12px" onclick="S.mode='${up?'in':'up'}';render()">${up?'عندي حساب — دخول':'ما عندي حساب — سجّل الآن'}</p></div>`},
async orders(){
  if(!S.user)return go('auth');
  $('#app').innerHTML='<h2>طلباتي</h2><div id="ol"></div>';
  const{data}=await sb.from('orders').select('*,order_items(*)').eq('user_id',S.user.id).order('id',{ascending:false});
  $('#ol').innerHTML=oh(data,0)},
async admin(){
  if(!S.admin)return go('shop');
  $('#app').innerHTML=`<h2>لوحة التحكم</h2><div class="chips"><span class="chip ${S.tab=='p'?'on':''}" onclick="S.tab='p';render()">المنتجات</span><span class="chip ${S.tab=='o'?'on':''}" onclick="S.tab='o';render()">الطلبات</span></div><div id="ad2"></div>`;
  if(S.tab=='o'){const{data}=await sb.from('orders').select('*,order_items(*)').order('id',{ascending:false});$('#ad2').innerHTML=oh(data,1);return}
  const e=S.products.find(p=>p.id==S.edit)||{};
  $('#ad2').innerHTML=`<div class="card"><h3>${e.id?'تعديل منتج':'إضافة منتج'}</h3>
  <input class="in" id="pn" placeholder="اسم المنتج" value="${esc(e.name)}">
  <input class="in" id="pp" type="number" placeholder="السعر (دينار)" value="${e.price??''}">
  <input class="in" id="ps" type="number" placeholder="الكمية المتوفرة" value="${e.stock??''}">
  <input class="in" id="pc" placeholder="القسم (مثلاً: عناية بالبشرة)" value="${esc(e.category)}">
  <input class="in" id="pi" placeholder="رابط الصورة" value="${esc(e.image_url)}">
  <textarea class="in" id="pd" placeholder="التفاصيل">${esc(e.description)}</textarea>
  <label><input type="checkbox" id="pa" ${e.active===false?'':'checked'}> ظاهر بالمتجر</label>
  <button class="btn big" onclick="saveP(${e.id||0})">حفظ</button></div>`+
  S.products.map(p=>`<div class="line"><span>${esc(p.name)}${p.active?'':' (مخفي)'}<br><small class="m">${fmt(p.price)} — الكمية ${p.stock}</small></span>
  <span><button class="btn" onclick="S.edit=${p.id};render();scrollTo(0,0)">تعديل</button> <button class="btn del" onclick="delP(${p.id})">حذف</button></span></div>`).join('')}
};

function grid(){
  const q=S.q.toLowerCase(),l=S.products.filter(p=>p.active&&(!S.cat||p.category==S.cat)&&p.name.toLowerCase().includes(q));
  $('#grid').innerHTML=l.map(p=>`<div class="card"><div class="img">${p.image_url?`<img src="${esc(p.image_url)}" alt="" loading="lazy">`:'💜'}</div>
  <h3>${esc(p.name)}</h3><p class="m">${esc(p.description)}</p>
  <div class="row"><b>${fmt(p.price)}</b>${p.stock>0?`<button class="btn" onclick="add(${p.id})">أضف</button>`:'<span class="er">نفدت الكمية</span>'}</div>
  ${p.stock>0&&p.stock<=5?`<small class="er">باقي ${p.stock} فقط</small>`:''}</div>`).join('')||'<p class="m">لا توجد منتجات حالياً.</p>'}

function add(id){const p=S.products.find(x=>x.id==id),i=S.cart.find(x=>x.id==id);
  if((i?i.qty:0)+1>p.stock)return toast('الكمية المتوفرة '+p.stock);
  i?i.qty++:S.cart.push({id,qty:1});save();cc();toast('أضيف للسلة ✓')}
function qty(id,d){const i=S.cart.find(x=>x.id==id),p=S.products.find(x=>x.id==id);i.qty+=d;
  if(i.qty>p.stock){i.qty=p.stock;toast('الكمية المتوفرة '+p.stock)}
  if(i.qty<=0)S.cart=S.cart.filter(x=>x.id!=id);save();render()}

async function checkout(){
  const n=$('#n').value.trim(),ph=$('#ph').value.trim(),ad=$('#ad').value.trim();
  if(!n||!ph||!ad)return toast('أكمل الاسم والرقم والعنوان');
  const{error}=await sb.rpc('place_order',{p_name:n,p_phone:ph,p_address:ad,p_notes:$('#nt').value,p_items:S.cart});
  if(error){await load();return toast(error.message)}
  await sb.from('profiles').upsert({id:S.user.id,full_name:n,phone:ph,address:ad});
  S.profile={full_name:n,phone:ph,address:ad};S.cart=[];save();await load();toast('تم إرسال طلبك ✓');go('orders')}

async function doAuth(){
  const e=$('#ae').value.trim(),w=$('#aw').value,up=S.mode=='up';let r;
  if(up){r=await sb.auth.signUp({email:e,password:w});if(!r.error&&!r.data.session)return toast('تحقق من إيميلك لتفعيل الحساب')}
  else r=await sb.auth.signInWithPassword({email:e,password:w});
  if(r.error)return toast(r.error.message);
  if(up)await sb.from('profiles').upsert({id:r.data.user.id,full_name:$('#an').value,phone:$('#ap').value,address:$('#aa').value});
  S.mode='in';await setUser(r.data.user);await load();toast('أهلاً بك ✓');go(S.cart.length?'cart':'shop')}
async function logout(){await sb.auth.signOut();await setUser(null);await load();go('shop')}

const oh=(l,a)=>(l||[]).map(o=>`<div class="card"><div class="row"><b>طلب #${o.id}</b>
  ${a?`<select class="in" style="width:auto" onchange="setSt(${o.id},this.value)">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="chip on">${esc(o.status)}</span>`}</div>
  ${a?`<p>${esc(o.customer_name)} — <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.address)}${o.notes?'<br>ملاحظة: '+esc(o.notes):''}</p>`:''}
  <ul>${o.order_items.map(i=>`<li>${esc(i.name)} × ${i.qty}</li>`).join('')}</ul>
  <div class="row"><b>${fmt(o.total)}</b><small class="m">${new Date(o.created_at).toLocaleString('ar-IQ')}</small></div></div>`).join('')||'<p class="m">لا توجد طلبات.</p>';

async function saveP(id){
  const r={name:$('#pn').value.trim(),price:+$('#pp').value,stock:parseInt($('#ps').value)||0,category:$('#pc').value.trim()||null,image_url:$('#pi').value.trim()||null,description:$('#pd').value.trim()||null,active:$('#pa').checked};
  if(!r.name||!($('#pp').value!==''&&r.price>=0))return toast('أكمل الاسم والسعر');
  const{error}=id?await sb.from('products').update(r).eq('id',id):await sb.from('products').insert(r);
  if(error)return toast(error.message);S.edit=0;await load();toast('تم الحفظ ✓');render()}
async function delP(id){if(!confirm('حذف المنتج؟'))return;const{error}=await sb.from('products').delete().eq('id',id);if(error)return toast(error.message);await load();render()}
async function setSt(id,s){const{error}=await sb.from('orders').update({status:s}).eq('id',id);toast(error?error.message:'تم التحديث ✓')}

init();
</script>
</body>
</html>
