<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavenders | متجر مستحضرات التجميل</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الشريط العلوي -->
  <header class="topbar">
    <div class="side">
      <button class="icon-btn" onclick="app.openSearch()">🔍</button>
      <a class="icon-btn" href="#" onclick="app.openWhatsApp('استفسار عام'); return false;">🟢</a>
    </div>
    <a href="#/" class="logo">LAVENDERS</a>
    <button class="icon-btn" onclick="app.toggleMenu()">☰</button>
  </header>

  <!-- قائمة الأقسام المنسدلة -->
  <div id="menuOverlay" class="overlay" onclick="app.toggleMenu()"></div>
  <div id="menuDrawer" class="drawer">
    <button class="drawer-close" onclick="app.toggleMenu()">✕</button>
    <h3 style="margin-top:40px;">الأقسام</h3>
    <div id="menuCategoryList"></div>
  </div>

  <!-- البحث -->
  <div id="searchOverlay" class="overlay" onclick="app.closeSearch()"></div>
  <div id="searchDrawer" class="drawer">
    <button class="drawer-close" onclick="app.closeSearch()">✕</button>
    <h3 style="margin-top:40px;">ابحث عن منتج</h3>
    <div class="form-field">
      <input id="searchInput" type="text" placeholder="اكتب اسم المنتج..." oninput="app.doSearch(this.value)">
    </div>
    <div id="searchResults" class="product-grid"></div>
  </div>

  <!-- سلة المشتريات -->
  <div id="cartOverlay" class="overlay" onclick="app.closeCart()"></div>
  <div id="cartDrawer" class="drawer">
    <button class="drawer-close" onclick="app.closeCart()">✕</button>
    <h3 style="margin-top:40px;">سلة المشتريات</h3>
    <div id="cartItemsBox"></div>
    <div class="cart-total"><span>الإجمالي</span><span id="cartTotal">0 د.ع</span></div>
    <button class="primary-btn" onclick="app.goCheckout()">إتمام الطلب</button>
  </div>

  <!-- محتوى الصفحة -->
  <main id="pageContent"></main>

  <!-- الشريط السفلي الثابت -->
  <nav class="bottom-nav">
    <button class="nav-btn" id="navAccount" onclick="location.hash='#/account'">
      <span class="nav-icon">👤</span><span class="nav-label">حسابي</span>
    </button>
    <button class="nav-btn" id="navCart" onclick="app.openCart()">
      <span class="nav-icon">🛒<span id="cartBadge" class="cart-badge" style="display:none;">0</span></span>
      <span class="nav-label">السلة</span>
    </button>
    <button class="nav-btn" id="navDiscounts" onclick="location.hash='#/discounts'">
      <span class="nav-icon">٪</span><span class="nav-label">الخصومات</span>
    </button>
    <button class="nav-btn" id="navAll" onclick="location.hash='#/all'">
      <span class="nav-icon">▦</span><span class="nav-label">الفئات</span>
    </button>
    <button class="nav-btn" id="navHome" onclick="location.hash='#/'">
      <span class="nav-icon">🏠</span><span class="nav-label">الرئيسية</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
